services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: fraudlens
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens -d fraudlens"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      FRAUDLENS_ENVIRONMENT: development
      FRAUDLENS_API_PRINCIPALS: ${FRAUDLENS_API_PRINCIPALS:-[]}
      FRAUDLENS_HUMAN_AUTH_ENABLED: ${FRAUDLENS_HUMAN_AUTH_ENABLED:-false}
      FRAUDLENS_HUMAN_ORIGIN: ${FRAUDLENS_HUMAN_ORIGIN:-http://127.0.0.1:5173}
      FRAUDLENS_HUMAN_LOCAL_INSECURE: ${FRAUDLENS_HUMAN_LOCAL_INSECURE:-true}
      FRAUDLENS_DATABASE_URL: postgresql+psycopg://fraudlens:${POSTGRES_PASSWORD}@postgres:5432/fraudlens
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
