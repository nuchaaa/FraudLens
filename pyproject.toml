[project]
name = "fraudlens"
version = "0.1.0"
description = "Explainable adaptive behavioral fraud detection — research foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=25.1,<26",
  "webauthn==3.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1",
  "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3",
]
ml = [
    "scikit-learn>=1.8,<1.9",
    "xgboost>=3.2,<3.3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend", "ml/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires TEST_DATABASE_URL to a disposable PostgreSQL database"]

[tool.coverage.run]
source = ["backend"]
branch = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib"]
ignore_missing_imports = true
