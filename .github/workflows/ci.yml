name: FraudLens checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker build -t fraudlens-console:ci .
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: fraudlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fraudlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fraudlens -d fraudlens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fraudlens:ci-only-password@localhost:5432/fraudlens_test
      FRAUDLENS_DATABASE_URL: postgresql+psycopg://fraudlens:ci-only-password@localhost:5432/fraudlens_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked --group ml
      - run: uv run --group ml ruff check . && uv run --group ml ruff format --check .
      - run: uv run --group ml mypy
      - run: uv run --group ml alembic upgrade head
      - name: Test through a disposable local PostgreSQL socket
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq socat
          socket_dir="$RUNNER_TEMP/fraudlens-pg-socket"
          mkdir -m 0700 "$socket_dir"
          socat UNIX-LISTEN:"$socket_dir/.s.PGSQL.55439",fork,mode=0600 TCP:127.0.0.1:5432 &
          proxy_pid=$!
          trap 'kill "$proxy_pid"' EXIT
          for attempt in {1..50}; do
            if [ -S "$socket_dir/.s.PGSQL.55439" ]; then break; fi
            sleep 0.1
          done
          test -S "$socket_dir/.s.PGSQL.55439"
          export TEST_DATABASE_URL="postgresql+psycopg://fraudlens:ci-only-password@/fraudlens_test?host=$socket_dir&port=55439"
          export FRAUDLENS_DATABASE_URL="$TEST_DATABASE_URL"
          uv run --group ml pytest --cov=backend --cov=ml.src --cov-report=term-missing
      - run: uv export --locked --group ml --format requirements-txt --no-emit-project --no-hashes > /tmp/fraudlens-requirements.txt
      - run: uv run --group ml pip-audit --disable-pip --no-deps -r /tmp/fraudlens-requirements.txt
      - run: uv build
      - run: docker build -t fraudlens:ci .
